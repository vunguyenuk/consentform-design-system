/* v32: motion — short, eased, interruptible; nothing longer than 280ms */
:root{--ease-out:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.4,0,1,1)}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-out{from{opacity:1}to{opacity:0}}
@keyframes drawer-in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes drawer-out{from{opacity:1;transform:none}to{opacity:0;transform:translateX(28px)}}
@keyframes pop-in{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@keyframes rise-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes modal-in{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes viewer-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,10px) scale(.98)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toast-out{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(224,161,0,.18)}50%{box-shadow:0 0 0 6px rgba(224,161,0,.05)}}
.overlay{animation:fade-in .2s var(--ease-out) both}
.drawer{animation:drawer-in .26s var(--ease-out) both;will-change:transform}
.closing .overlay{animation:fade-out .16s var(--ease-in) both}
.closing .drawer{animation:drawer-out .16s var(--ease-in) both}
.drawer .db>*{animation:rise-in .24s var(--ease-out) both}
.drawer .db>*:nth-child(2){animation-delay:20ms}.drawer .db>*:nth-child(3){animation-delay:40ms}.drawer .db>*:nth-child(4){animation-delay:60ms}.drawer .db>*:nth-child(n+5){animation-delay:80ms}
.page{animation:rise-in .22s var(--ease-out) both}
.menu,.combo-list{animation:pop-in .14s var(--ease-out) both;transform-origin:top right}
.combo-list{transform-origin:top left}
.toast{animation:toast-in .22s var(--ease-out) both}
.toast-out{animation:toast-out .18s var(--ease-in) both}
.auth{animation:modal-in .22s var(--ease-out) both}
.viewer{animation:viewer-in .22s var(--ease-out) both}
.editbox,.selbar,.banner,.dupbox,.decide,.warnbox,.okbox,.fixes{animation:rise-in .2s var(--ease-out) both}
.btn,.pill,.ftab,.nav,.pg,.sorth,.link,.xsm,.combo-opt,.pickrow,.metalink,.tlink,.cthumb{transition:background-color .14s ease,color .14s ease,box-shadow .14s ease,border-color .14s ease,transform .1s ease,opacity .14s ease}
.btn:active:not(:disabled),.pg:active:not(:disabled){transform:scale(.97)}
.ftab{transition:color .14s ease,border-color .2s var(--ease-out)}
.tr{transition:background-color .12s ease}
.chip,.tag,.chg{transition:background-color .2s ease,color .2s ease}
.radio{transition:box-shadow .16s var(--ease-out)}
.inp{transition:box-shadow .14s ease,background-color .14s ease}
.dd .btn svg{transition:transform .16s var(--ease-out)}
.dd .btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.drop{transition:background-color .16s ease,box-shadow .16s ease}
.drop:hover{background:#FAFAF8}
.stp-n{transition:background-color .2s ease,color .2s ease}
.stp:not(:last-child)::after{transition:background-color .2s ease}
.stp-done:not(:last-child)::after{background:#BFD9AE}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="app">

<aside class="side" aria-label="Main navigation">
  <button class="brand" type="button" onClick="{{goAudits}}" title="Census audits"><div class="logo"><template data-sc="if" data-value="{{logo.has}}"><img class="logo-img" src="{{logo.src}}" alt=""></template><template data-sc="if" data-value="{{logo.none}}"><span>CC</span></template></div><div class="brand-t"><b>ENT Spartan</b><span>Census audit</span></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg></button>
  <button class="nav {{navAuditsCls}}" onClick="{{goAudits}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"></rect><path d="M9 4h6v3H9zM9 12.5l2 2 4-4"></path></svg>
    <span>Census audits</span>
    <template data-sc="if" data-value="{{hasToReview}}"><span class="badge">{{toReviewCount}}</span></template>
  </button>
  <button class="nav {{navFacCls}}" onClick="{{goFacilities}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V6l8-3 8 3v15M9 21v-5h6v5M9 9h.01M15 9h.01M9 12.5h.01M15 12.5h.01"></path></svg>
    <span>Facilities</span>
  </button>
  <div class="grp">Organization</div>
  <button class="nav {{navSetCls}}" onClick="{{goSettings}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg><span>Settings</span></button>
  <button class="nav {{navMemCls}}" onClick="{{goMembers}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.8-3.5 3.2-5 6-5s5.2 1.5 6 5M17 8v6M14 11h6"></path></svg><span>Members</span></button>
  <button class="nav {{navFbCls}}" onClick="{{goFeedback}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z"></path></svg><span>Feedback</span></button>
  <button class="drc" type="button" onClick="{{goDrSettings}}" title="DrChrono settings"><span class="pulse {{dr.dotCls}}"></span><div><b>DrChrono</b>{{dr.side}}</div></button>
</aside>

<div class="main"><div class="surface">
  <header class="top">
    <nav class="crumbs" aria-label="Breadcrumb">
      <template data-sc="for" data-list="{{crumbs}}" data-as="c">
        <template data-sc="if" data-value="{{c.isLink}}"><button class="crumb" onClick="{{c.go}}">{{c.label}}</button><span class="sep" aria-hidden="true">/</span></template>
        <template data-sc="if" data-value="{{c.isNow}}"><span class="crumb-now">{{c.label}}</span></template>
      </template>
    </nav>
    <div class="btns">
      <button class="search" onClick="{{goSearch}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span class="stext">Search residents, audits…</span><span class="kbd">⌘K</span></button>
      <button class="guide" type="button" onClick="{{openGuide}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"></path></svg>Guide</button>
      <div class="avatar" aria-label="Vu Nguyen">VN</div>
    </div>
  </header>

  <!-- ============ AUDITS LIST (home) ============ -->
  <template data-sc="if" data-value="{{isAudits}}">
  <div class="page" data-key="k1">
    <div class="head">
      <div>
        <h1>Census audits</h1>
        <p class="sub">Every census you upload becomes an audit.</p>
      </div>
      <button class="btn btn-pri" onClick="{{openUploadGlobal}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"></path></svg>Upload documents</button>
    </div>
    <div class="drbanner {{dr.bannerCls}}"><span class="l"><span class="pulse {{dr.dotCls}}"></span><span>{{dr.banner}}</span></span><button class="link" onClick="{{dr.bannerAct}}">{{dr.bannerCta}}</button></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Show">
        <template data-sc="for" data-list="{{listTabs}}" data-as="t"><button class="pill {{t.cls}}" onClick="{{t.pick}}">{{t.label}} <i>{{t.n}}</i></button></template>
      </div>
      <label class="field" style="flex-direction: row; align-items: center; gap: 10px"><span class="hint">Facility</span>
        <span class="sel" style="min-width: 260px"><select class="inp" value="{{facFilter}}" onChange="{{onFacFilter}}">
          <option value="all">All facilities</option>
          <template data-sc="for" data-list="{{facOptions}}" data-as="o"><option value="{{o.id}}">{{o.name}}</option></template>
        </select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      </label>
    </div>
    <div class="card tablebox">
      <div class="grid-a th"><span>Facility</span><span>Census date</span><span>Residents</span><span>Due</span><span>New</span><span>Missing face sheets</span><span>Status</span></div>
      <template data-sc="for" data-list="{{auditRows}}" data-as="a">
        <button class="tr grid-a {{a.rowCls}}" onClick="{{a.open}}">
          <span class="who"><span class="mav {{a.monoCls}}">{{a.mono}}</span><span class="nm"><b>{{a.facName}}<template data-sc="if" data-value="{{a.hasTag}}"><span class="tag {{a.tagCls}}">{{a.tag}}</span></template></b><span>{{a.note}}</span></span></span>
          <span class="num">{{a.date}}</span><span class="num">{{a.res}}</span><span class="num">{{a.due}}</span><span class="num">{{a.fresh}}</span><span class="{{a.missCls}}">{{a.missing}}</span>
          <span class="st {{a.stCls}}">{{a.stLabel}}</span>
        </button>
      </template>
      <template data-sc="if" data-value="{{noAuditRows}}"><div class="note">Nothing waiting for review. New censuses land here after you upload them.</div></template>
    </div>
  </div>
  </template>

  <!-- ============ AUDIT DETAIL ============ -->
  <template data-sc="if" data-value="{{isAudit}}">
  <div class="page" data-key="k2">
    <div class="head">
      <div class="title">
        <span class="mav {{au.monoCls}}" style="width: 40px; height: 40px; border-radius: 11px; font-size: 13px">{{au.mono}}</span>
        <div>
          <h1>{{au.facName}}</h1>
          <p class="sub" style="margin-top: 6px"><span>Census {{au.date}}</span><i>·</i><span>{{au.res}} residents</span><i>·</i><span class="st {{au.stCls}}">{{au.stLabel}}</span><i>·</i><span class="sub-note">{{au.note}}</span></p>
        </div>
      </div>
      <div class="btns">
        <button class="btn btn-ghost" onClick="{{au.edit}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg><span>Edit</span></button>
        <button class="btn" onClick="{{au.upload}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"></path></svg>Upload</button>
        <template data-sc="if" data-value="{{au.canReview}}"><button class="btn btn-pri" onClick="{{au.review}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Mark reviewed</button></template>
        <template data-sc="if" data-value="{{au.isReviewed}}"><button class="btn btn-ghost" onClick="{{au.review}}">Reopen</button></template>
      </div>
    </div>
    <template data-sc="if" data-value="{{au.superseded}}">
      <div class="banner"><span>A newer census for this facility exists ({{au.newerDate}}). This one is kept for reference.</span><button class="link" onClick="{{au.openNewer}}">Open the latest →</button></div>
    </template>
    <div class="card tablebox">
      <div class="tbar tbar-tabs">
        <div class="ftabs" role="tablist" aria-label="Filter residents">
          <template data-sc="for" data-list="{{kpis}}" data-as="k">
            <button class="ftab {{k.ftCls}}" role="tab" aria-selected="{{k.on}}" onClick="{{k.pick}}" title="{{k.sub}}"><span class="kdot {{k.dot}}"></span><span>{{k.tabLabel}}</span><b class="{{k.nCls}}">{{k.n}}</b></button>
          </template>
        </div>
        <div class="btns">
          <template data-sc="if" data-value="{{showReq}}"><button class="btn btn-sm btn-accent" onClick="{{requestAll}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"></path></svg><span>{{reqAllLabel}}</span></button><span class="tsep" aria-hidden="true"></span></template>
          <div class="dd"><button class="btn btn-sm btn-ghost" onClick="{{dl.toggle}}" aria-expanded="{{dl.open}}"><span>Download</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
            <template data-sc="if" data-value="{{dl.open}}"><div class="menu" role="menu"><button role="menuitem" onClick="{{dl.csv}}"><b>CSV</b><span>{{dl.scope}}</span></button><button role="menuitem" onClick="{{dl.pdf}}"><b>PDF</b><span>Audit report with your office address</span></button><button role="menuitem" onClick="{{dl.print}}"><b>Print</b><span>Opens the print view</span></button></div></template>
          </div>
        </div>
      </div>
      <template data-sc="if" data-value="{{hasResidents}}">
        <template data-sc="if" data-value="{{sel.any}}">
          <div class="selbar"><b>{{sel.label}}</b><button class="link" onClick="{{sel.clear}}">Clear</button><span class="sp"></span><template data-sc="if" data-value="{{sel.hasMissing}}"><button class="btn btn-sm btn-accent" onClick="{{sel.request}}"><span>{{sel.reqLabel}}</span></button></template><button class="btn btn-sm btn-ghost" onClick="{{sel.csv}}">Download CSV</button></div>
        </template>
        <div class="grid-r grid-ck th" style="border-radius: 0">
          <span class="cbx"><input type="checkbox" aria-label="Select all residents shown" checked="{{sel.all}}" onChange="{{sel.toggleAll}}"></span>
          <button class="sorth {{srt.room.cls}}" onClick="{{srt.room.go}}"><span>Room</span><i>{{srt.room.ar}}</i></button>
          <button class="sorth {{srt.name.cls}}" onClick="{{srt.name.go}}"><span>Resident</span><i>{{srt.name.ar}}</i></button>
          <button class="sorth {{srt.last.cls}}" onClick="{{srt.last.go}}"><span>Last seen</span><i>{{srt.last.ar}}</i></button>
          <button class="sorth {{srt.status.cls}}" onClick="{{srt.status.go}}"><span>Status</span><i>{{srt.status.ar}}</i></button>
          <button class="sorth {{srt.cov.cls}}" onClick="{{srt.cov.go}}"><span>Coverage</span><i>{{srt.cov.ar}}</i></button>
          <button class="sorth {{srt.fs.cls}}" onClick="{{srt.fs.go}}"><span>Face sheet</span><i>{{srt.fs.ar}}</i></button>
        </div>
        <template data-sc="for" data-list="{{rows}}" data-as="r">
          <div class="tr grid-r grid-ck {{r.rowCls}}" role="button" tabindex="0" onClick="{{r.open}}">
            <span class="cbx"><input type="checkbox" aria-label="Select resident" checked="{{r.sel}}" onClick="{{r.toggleSel}}"></span>
            <span class="room">{{r.room}}</span>
            <span class="who"><span class="pav">{{r.ini}}</span><span class="nm"><b>{{r.name}}</b><span>DOB {{r.dob}}</span></span><template data-sc="if" data-value="{{r.hasChg}}"><span class="chg {{r.chgCls}}">{{r.chg}}</span></template></span>
            <span class="{{r.lastCls}}">{{r.last}}</span>
            <span><span class="chip {{r.stCls}}">{{r.stLabel}}</span></span>
            <span class="{{r.covCls}}">{{r.covLabel}}</span>
            <span><span class="{{r.fsCls}}">{{r.fsLabel}}</span></span>
          </div>
        </template>
        <div class="tfoot"><span>{{tfootLabel}}<span class="sub-note">{{tfootChanges}}</span></span>
          <div class="tfoot-r">
            <div class="pager"><span class="lbl">Rows</span><span class="sel"><select class="inp" value="{{pg.size}}" onChange="{{pg.onSize}}" aria-label="Rows per page"><option value="5">5</option><option value="10">10</option><option value="25">25</option></select><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></div>
            <div class="pager" role="navigation" aria-label="Pages">
              <button class="pg" disabled="{{pg.noPrev}}" onClick="{{pg.prev}}" aria-label="Previous page">‹</button>
              <template data-sc="for" data-list="{{pg.pages}}" data-as="n"><button class="pg {{n.cls}}" onClick="{{n.go}}" aria-current="{{n.cur}}">{{n.n}}</button></template>
              <button class="pg" disabled="{{pg.noNext}}" onClick="{{pg.next}}" aria-label="Next page">›</button>
            </div>
          </div>
        </div>
      </template>
      <template data-sc="if" data-value="{{noResidents}}"><div class="note">Prototype: resident rows are mocked for Linden Healthcare Center · 10/16/2026 only.</div></template>
    </div>
  </div>
  </template>

  <!-- ============ FACILITIES LIST ============ -->
  <template data-sc="if" data-value="{{isFacilities}}">
  <div class="page" data-key="k3">
    <div class="head">
      <div><h1>Facilities</h1><p class="sub">Open a facility to see its census audits and residents.</p></div>
      <button class="btn" onClick="{{openNewFac}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add facility</button>
    </div>
    <div class="card tablebox">
      <div class="grid-f th"><span>Facility</span><span>City</span><span>Audits</span><span>Latest census</span><span>Latest status</span></div>
      <template data-sc="for" data-list="{{facRows}}" data-as="f">
        <button class="tr grid-f" onClick="{{f.open}}">
          <span class="who"><span class="mav {{f.monoCls}}">{{f.mono}}</span><span class="nm"><b>{{f.name}}</b><span>{{f.email}}</span></span></span>
          <span class="{{f.cityCls}}">{{f.city}}</span><span class="num">{{f.count}}</span><span class="{{f.latestCls}}">{{f.latest}}</span>
          <span class="st {{f.stCls}}">{{f.stLabel}}</span>
        </button>
      </template>
    </div>
  </div>
  </template>

  <!-- ============ FACILITY DETAIL ============ -->
  <template data-sc="if" data-value="{{isFacility}}">
  <div class="page" data-key="k4">
    <div class="head">
      <div class="title">
        <span class="mav {{fac.monoCls}}" style="width: 52px; height: 52px; border-radius: 14px; font-size: 16px">{{fac.mono}}</span>
        <div>
          <h1>{{fac.name}}</h1>
          <div class="meta">
            <span class="metaitem"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg><span class="{{fac.cityCls}}">{{fac.cityLabel}}</span></span>
            <span class="metaitem"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6"></path></svg><span class="{{fac.emailCls}}">{{fac.emailLabel}}</span></span>
            <template data-sc="if" data-value="{{fac.hasOffice}}"><span class="metachip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg><span>DrChrono office: {{fac.officeName}}</span></span></template>
            <template data-sc="if" data-value="{{fac.noOffice}}"><button class="metaitem metalink" onClick="{{fac.linkDr}}" title="Link this facility to its DrChrono office for faster checks"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg><span>Link DrChrono office</span></button></template>
          </div>
        </div>
      </div>
      <div class="btns"><button class="btn btn-ghost" onClick="{{openEditFac}}">Edit details</button><button class="btn btn-pri" onClick="{{openUploadFac}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"></path></svg>Upload census</button></div>
    </div>
    <div class="tabs" role="tablist">
      <template data-sc="for" data-list="{{facTabs}}" data-as="t"><button class="tab {{t.cls}}" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}} <i>{{t.n}}</i></button></template>
    </div>

    <template data-sc="if" data-value="{{showFacAudits}}">
      <div class="card tablebox">
        <div class="grid-a th"><span>Census</span><span>Census date</span><span>Residents</span><span>Due</span><span>New</span><span>Missing face sheets</span><span>Status</span></div>
        <template data-sc="for" data-list="{{facAuditRows}}" data-as="a">
          <button class="tr grid-a {{a.rowCls}}" onClick="{{a.open}}">
            <span class="nm"><b>{{a.title}}<template data-sc="if" data-value="{{a.hasTag}}"><span class="tag {{a.tagCls}}">{{a.tag}}</span></template></b><span>{{a.note}}</span></span>
            <span class="num">{{a.date}}</span><span class="num">{{a.res}}</span><span class="num">{{a.due}}</span><span class="num">{{a.fresh}}</span><span class="{{a.missCls}}">{{a.missing}}</span>
            <span class="st {{a.stCls}}">{{a.stLabel}}</span>
          </button>
        </template>
      </div>
    </template>

    <template data-sc="if" data-value="{{showFacEmpty}}">
      <div class="card empty">
        <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"></path></svg></div>
        <h3>No census audits yet</h3>
        <p>Upload the first census for {{fac.name}}, with face sheets if you have them. Residents, due dates and coverage fill in from there.</p>
        <button class="btn btn-pri" onClick="{{openUploadFac}}">Upload first census</button>
      </div>
    </template>

    <template data-sc="if" data-value="{{showFacResidents}}">
      <div class="card tablebox">
        <div class="filters">
          <div class="seg" role="group" aria-label="Status">
            <template data-sc="for" data-list="{{rfTabs}}" data-as="t"><button class="pill {{t.cls}}" onClick="{{t.pick}}">{{t.label}} <i>{{t.n}}</i></button></template>
          </div>
          <span class="sel" style="min-width: 200px"><select class="inp" value="{{rfCov}}" onChange="{{onRfCov}}"><option value="all">All coverage</option><option value="covered">Covered</option><option value="unknown">Unknown</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
        </div>
        <template data-sc="if" data-value="{{noFacResRows}}"><div class="note">No residents match these filters. <button class="link" onClick="{{clearRf}}">Clear filters</button></div></template>
        <div class="grid-r th" style="border-radius: 0"><span>Room</span><span>Resident</span><span>Last seen</span><span>Status</span><span>Coverage</span><span>Face sheet</span></div>
        <template data-sc="for" data-list="{{facResidentRows}}" data-as="r">
          <button class="tr grid-r" onClick="{{r.open}}">
            <span class="room">{{r.room}}</span>
            <span class="who"><span class="pav">{{r.ini}}</span><span class="nm"><b>{{r.name}}</b><span>{{r.subline}}</span></span></span>
            <span class="{{r.lastCls}}">{{r.last}}</span>
            <span><span class="chip {{r.stCls}}">{{r.stLabel}}</span></span>
            <span class="{{r.covCls}}">{{r.covLabel}}</span>
            <span><span class="{{r.fsCls}}">{{r.fsLabel}}</span></span>
          </button>
        </template>
      </div>
    </template>
    <template data-sc="if" data-value="{{showFacResEmpty}}">
      <div class="card empty"><h3>{{facResEmptyTitle}}</h3><p>{{facResEmptyText}}</p></div>
    </template>
  </div>
  </template>
  <!-- ============ SEARCH ============ -->
  <template data-sc="if" data-value="{{isSearch}}">
  <div class="page" data-key="k5">
    <div class="head"><div><h1>Find a resident</h1><p class="sub">Search every facility by name, resident ID or date of birth.</p></div></div>
    <label class="searchbig"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input class="sbin" aria-label="Search residents" placeholder="Try “Carney”, 2067 or 09/16/1943" value="{{q}}" onChange="{{onQ}}"><template data-sc="if" data-value="{{hasQ}}"><button class="x" style="margin: 0" onClick="{{clearQ}}" aria-label="Clear search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></template></label>
    <template data-sc="if" data-value="{{hasQ}}">
      <div class="split">
        <div class="facet">
          <p class="hint" style="margin: 0 12px 10px">{{qSummary}}</p>
          <template data-sc="for" data-list="{{qFacets}}" data-as="f"><button class="fbtn {{f.cls}}" onClick="{{f.pick}}"><span>{{f.name}}</span><i>{{f.n}}</i></button></template>
        </div>
        <div class="card tablebox">
          <div class="grid-s th"><span>Room</span><span>Resident</span><span>Facility</span><span>Last seen</span><span>Status</span><span>Latest census</span></div>
          <template data-sc="for" data-list="{{qRows}}" data-as="r">
            <button class="tr grid-s" onClick="{{r.open}}">
              <span class="room">{{r.room}}</span>
              <span class="who"><span class="pav">{{r.ini}}</span><span class="nm"><b>{{r.name}}</b><span>{{r.rid}} · DOB {{r.dob}}</span></span></span>
              <span class="q" style="color: #3A3A3E">{{r.facName}}</span>
              <span class="{{r.lastCls}}">{{r.last}}</span>
              <span><span class="chip {{r.stCls}}">{{r.stLabel}}</span></span>
              <span class="nm"><b style="font-weight: 400">{{r.latest}}</b><span>{{r.censLabel}}</span></span>
            </button>
          </template>
          <template data-sc="if" data-value="{{noQRows}}"><div class="note">No residents match “{{q}}”. Try the resident ID or date of birth instead.</div></template>
        </div>
      </div>
    </template>
    <template data-sc="if" data-value="{{noQ}}">
      <div class="card empty">
        <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></div>
        <h3>Search across every facility</h3>
        <p>Handy when a facility calls about a resident and you don't know which census they're on. Results open the resident's full history.</p>
      </div>
    </template>
  </div>
  </template>

  <!-- ============ MEMBERS ============ -->
  <template data-sc="if" data-value="{{isMembers}}">
  <div class="page" data-key="k6">
    <div class="head">
      <div><h1>Members</h1><p class="sub">People who can sign in, and what their position lets them do.</p></div>
      <button class="btn btn-pri" onClick="{{openAddMember}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add member</button>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Position">
        <template data-sc="for" data-list="{{memberTabs}}" data-as="t"><button class="pill {{t.cls}}" onClick="{{t.pick}}">{{t.label}} <i>{{t.n}}</i></button></template>
      </div>
      <input class="inp" style="min-width: 260px" type="search" aria-label="Search members" placeholder="Search name or email" value="{{mq}}" onChange="{{onMq}}">
    </div>
    <div class="card tablebox">
      <div class="grid-m th"><span>Member</span><span>Position</span><span>Status</span><span>Last active</span><span></span></div>
      <template data-sc="for" data-list="{{memberRows}}" data-as="m">
        <div class="grid-m trs">
          <span class="who"><span class="pav">{{m.ini}}</span><span class="nm"><b>{{m.name}}<template data-sc="if" data-value="{{m.isYou}}"><span class="you">You</span></template></b><span>{{m.email}}</span></span></span>
          <span class="q" style="color: #3A3A3E">{{m.posLabel}}</span>
          <span class="st {{m.stCls}}">{{m.stLabel}}</span>
          <span class="{{m.lastCls}}">{{m.last}}</span>
          <span style="justify-self: end"><button class="btn btn-sm btn-ghost" onClick="{{m.act}}">{{m.actLabel}}</button></span>
        </div>
      </template>
    </div>
    <div class="card">
      <div class="cardh"><div><h3>Positions</h3><p>Everyone needs a position, and there is always at least one admin.</p></div></div>
      <div class="grid-p th" style="min-height: 40px"><span>Permission</span><span>Scheduler</span><span>Admin</span></div>
      <template data-sc="for" data-list="{{perms}}" data-as="p">
        <div class="grid-p">
          <span>{{p.label}}</span>
          <span><template data-sc="if" data-value="{{p.s}}"><span class="yes" aria-label="Yes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></template><template data-sc="if" data-value="{{p.sNo}}"><span class="no" aria-label="No">—</span></template></span>
          <span><span class="yes" aria-label="Yes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></span>
        </div>
      </template>
    </div>
  </div>
  </template>

  <!-- ============ SETTINGS ============ -->
  <template data-sc="if" data-value="{{isSettings}}">
  <div class="page" data-key="k7">
    <div class="head"><div><h1>Organization settings</h1><p class="sub">Shown on face-sheet requests, CSV exports and printed audits.</p></div></div>
    <div class="card" style="padding: 0 28px">
      <div class="sec">
        <div><h3>Profile</h3><p>How the organization is named in the app and in emails to facilities.</p></div>
        <div class="fgrid">
          <div class="full logo-row"><div class="logo-big"><template data-sc="if" data-value="{{logo.has}}"><img class="logo-img" src="{{logo.src}}" alt="Organization logo"></template><template data-sc="if" data-value="{{logo.none}}"><span>CC</span></template></div><div class="btns"><span class="btn btn-sm filepick"><span>{{logo.cta}}</span><input type="file" accept="image/png,image/jpeg,image/webp" aria-label="Upload logo" onChange="{{logo.onFile}}"></span><template data-sc="if" data-value="{{logo.has}}"><button class="btn btn-sm btn-ghost" onClick="{{logo.remove}}">Remove</button></template><template data-sc="if" data-value="{{logo.none}}"><button class="btn btn-sm btn-ghost" onClick="{{logo.sample}}">Use sample logo</button></template><span class="hint {{logo.hintCls}}">{{logo.hint}}</span></div></div>
          <label class="field">Organization name<input class="inp" defaultValue="ENT Spartan" onInput="{{markDirty}}"></label>
          <label class="field"><span>Legal name<span class="opt-l">Optional</span></span><input class="inp" onInput="{{markDirty}}"></label>
          <label class="field"><span>Group NPI<span class="opt-l">Optional</span></span><input class="inp" placeholder="10 digits" onInput="{{markDirty}}"></label>
          <label class="field"><span>Tax ID (EIN)<span class="opt-l">Optional</span></span><input class="inp" placeholder="XX-XXXXXXX" onInput="{{markDirty}}"></label>
        </div>
      </div>
      <div class="sec">
        <div><h3>Contact</h3><p>Facilities reply to the request address when they send face sheets back.</p></div>
        <div class="fgrid">
          <label class="field">Email<input class="inp" type="email" placeholder="office@practice.example" onInput="{{markDirty}}"></label>
          <label class="field"><span>Request reply-to<span class="opt-l">Optional</span></span><input class="inp" type="email" placeholder="facesheets@practice.example" onInput="{{markDirty}}"></label>
          <label class="field">Phone<input class="inp" type="tel" placeholder="(555) 000-0000" onInput="{{markDirty}}"></label>
          <label class="field"><span>Fax<span class="opt-l">Optional</span></span><input class="inp" type="tel" onInput="{{markDirty}}"></label>
        </div>
      </div>
      <div class="sec">
        <div><h3>Address</h3><p>Printed in the header of audit PDFs. Dates in the app use this time zone.</p></div>
        <div class="fgrid">
          <label class="field full">Street address<input class="inp" placeholder="123 Main St" onInput="{{markDirty}}"></label>
          <label class="field">City<input class="inp" onInput="{{markDirty}}"></label>
          <label class="field">State and ZIP<span class="pw"><span class="sel" style="flex: 1"><select class="inp" onChange="{{markDirty}}"><option>CA</option><option>WA</option><option>OR</option><option>NV</option><option>AZ</option><option>TX</option><option>NY</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span><input class="inp" style="width: 120px" placeholder="ZIP" onInput="{{markDirty}}"></span></label>
          <label class="field full">Time zone<span class="sel"><select class="inp" onChange="{{markDirty}}"><option>Pacific (Los Angeles)</option><option>Mountain (Denver)</option><option>Arizona (Phoenix)</option><option>Central (Chicago)</option><option>Eastern (New York)</option><option>Alaska (Anchorage)</option><option>Hawaii (Honolulu)</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></label>
        </div>
      </div>
      <div class="sec">
        <div><h3>DrChrono</h3><p>Audits look up each resident's last completed visit here to set last seen and due status.</p></div>
        <div class="conn">
          <template data-sc="if" data-value="{{dr.on}}">
          <div class="conn-top"><span class="drico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v13H4zM9 7V4h6v3M12 11v5M9.5 13.5h5"></path></svg></span><div style="flex: 1"><b>DrChrono EHR</b><span>ENT Spartan · practice #091441</span></div><span class="ready">Connected</span></div>
          <dl class="conn-meta"><div><dt>Connected by</dt><dd>{{dr.by}}</dd></div><div><dt>Connected on</dt><dd class="mono-d">{{dr.onDate}}</dd></div><div><dt>Access</dt><dd>Read only · patients and appointments</dd></div><div><dt>Last check</dt><dd class="mono-d">{{connCheck}}</dd></div></dl>
          <div class="provs"><span class="hint" style="font-weight: 500; color: #3A3A3E">Providers found · {{dr.provN}}</span>
            <input class="inp" type="search" placeholder="Search {{dr.provN}} providers" aria-label="Search providers" value="{{dr.provQ}}" onChange="{{dr.onProvQ}}">
            <div class="provlist"><template data-sc="for" data-list="{{dr.provs}}" data-as="pv"><div>{{pv}}</div></template><template data-sc="if" data-value="{{dr.provNone}}"><div class="hint">No provider matches.</div></template></div>
          </div>
          <div class="conn-act"><div class="btns"><button class="btn btn-sm" onClick="{{testConn}}">Test connection</button><button class="btn btn-sm btn-ghost" type="button" onClick="{{reconnect}}">Reconnect</button></div><button class="btn btn-sm btn-ghost btn-danger" onClick="{{dr.disconnect}}">Disconnect</button></div>
          </template>
          <template data-sc="if" data-value="{{dr.off}}">
          <div class="conn-top"><span class="drico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v13H4zM9 7V4h6v3M12 11v5M9.5 13.5h5"></path></svg></span><div style="flex: 1"><b>{{dr.offTitle}}</b><span>{{dr.offSub}}</span></div><button class="btn btn-sm btn-pri" onClick="{{dr.connect}}">{{dr.connectCta}}</button></div>
          </template>
        </div>
      </div>
      <div class="sec">
        <div><h3>Due after</h3><p>How long after the last completed visit a resident becomes Due. Changes Due and Not due on every audit.</p></div>
        <div style="display: flex; flex-direction: column; gap: 14px">
          <div class="seg" role="group" aria-label="Due after"><template data-sc="for" data-list="{{dueOpts}}" data-as="d"><button class="pill {{d.cls}}" onClick="{{d.pick}}">{{d.label}}</button></template></div>
          <div class="preview"><span>Linden · census 10/16/2026 with this rule: <b>{{duePreview}} due</b>, {{notduePreview}} not due, {{newPreview}} new to ENT.</span></div>
        </div>
      </div>
    </div>
    <template data-sc="if" data-value="{{setDirty}}">
      <div class="savebar"><span>You have unsaved changes</span><button class="btn btn-sm" onClick="{{saveSettings}}">Save changes</button></div>
    </template>
  </div>
  </template>

  <!-- ============ FEEDBACK ============ -->
  <template data-sc="if" data-value="{{isFeedback}}">
  <div class="page" data-key="k8">
    <div class="head">
      <div><h1>Feedback</h1><p class="sub">Tell the CensusCare team what works, what gets in the way and what you need next.</p></div>
      <button class="btn btn-pri" onClick="{{openFbNew}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New feedback</button>
    </div>
    <template data-sc="if" data-value="{{hasFb}}">
      <div class="card tablebox">
        <div class="grid-fb th"><span>Request</span><span>Status</span><span>Sent by</span><span>Updated</span></div>
        <template data-sc="for" data-list="{{fbRows}}" data-as="f">
          <button class="tr grid-fb" onClick="{{f.open}}">
            <span class="nm"><b>{{f.title}}</b><span>{{f.typeLabel}}</span></span>
            <span class="st {{f.stCls}}">{{f.stLabel}}</span>
            <span class="q" style="color: #3A3A3E">{{f.by}}</span>
            <span class="num">{{f.sent}}</span>
          </button>
        </template>
      </div>
    </template>
    <template data-sc="if" data-value="{{noFb}}">
      <div class="card empty">
        <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z"></path></svg></div>
        <h3>Nothing sent yet</h3>
        <p>Everyone in your organization sees what was sent and where it stands, so check here before asking for the same thing twice.</p>
        <button class="btn btn-pri" onClick="{{openFbNew}}">New feedback</button>
      </div>
    </template>
    <p class="legend">Requests move through Open → In review → Planned → In progress → Done or Declined. The sender gets an email whenever the team answers.</p>
  </div>
  </template>
</div></div>

<!-- ============ DRAWERS ============ -->
<template data-sc="if" data-value="{{drawerOpen}}">
  <div class="{{drawerWrapCls}}" style="display: contents">
  <div class="overlay" onClick="{{closeDrawer}}"></div>
  <div class="drawer" role="dialog" aria-modal="true" aria-label="{{drawerTitle}}">

    <!-- Upload (wizard: 1 Facility → 2 Files → 3 Review) -->
    <template data-sc="if" data-value="{{isUpload}}">
      <div class="dh dh-wz"><div><h2>Upload documents</h2><div class="stepper" aria-label="Upload steps"><template data-sc="for" data-list="{{up.steps}}" data-as="st"><span class="stp {{st.cls}}"><span class="stp-n">{{st.n}}</span><span>{{st.label}}</span></span></template></div></div><button class="x" onClick="{{closeDrawer}}" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>

      <template data-sc="if" data-value="{{up.isAdding}}">
      <div class="db" data-key="k9">
        <div class="field combo-field">DrChrono office
          <div class="combo">
            <template data-sc="if" data-value="{{upo.has}}"><div class="combo-sel"><span class="dtx"><b>{{upo.name}}</b><span>{{upo.city}}</span></span><button class="xsm" onClick="{{upo.clear}}" aria-label="Clear DrChrono office"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></template>
            <template data-sc="if" data-value="{{upo.none}}">
              <div class="combo-in"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input class="inp" role="combobox" aria-expanded="{{upo.open}}" aria-label="DrChrono office" placeholder="Search your DrChrono offices" value="{{upo.q}}" onChange="{{upo.onQ}}" onClick="{{upo.openList}}" onKeyDown="{{upo.onKey}}"></div>
              <template data-sc="if" data-value="{{upo.open}}"><div class="combo-list" role="listbox">
                <template data-sc="for" data-list="{{upo.list}}" data-as="o"><button class="combo-opt" role="option" onClick="{{o.pick}}"><span class="dtx"><b>{{o.name}}</b><span>{{o.city}}</span></span><template data-sc="if" data-value="{{o.taken}}"><span class="tag">Already a facility</span></template></button></template>
                <template data-sc="if" data-value="{{upo.empty}}"><p class="combo-empty">No office matches. Check the name in DrChrono.</p></template>
              </div></template>
            </template>
          </div>
        </div>
        <template data-sc="if" data-value="{{up.dup}}"><div class="dupbox"><span>This office is already a facility: <b>{{up.dupName}}</b>. Its details are shown below.</span><button class="btn btn-sm btn-pri" onClick="{{up.useDup}}">Use this facility</button></div></template>
        <label class="field">Facility name<input class="inp" value="{{up.nf.name}}" onChange="{{up.onNfName}}" placeholder="e.g. Willow Park Care" disabled="{{up.dup}}"></label>
        <label class="field">City, state<input class="inp" value="{{up.nf.city}}" onChange="{{up.onNfCity}}" placeholder="Tacoma, WA" disabled="{{up.dup}}"></label>
        <label class="field">Contact email<input class="inp" type="email" value="{{up.nf.email}}" onChange="{{up.onNfEmail}}" placeholder="admissions@facility.example" disabled="{{up.dup}}"><span class="hint">Face-sheet requests are sent here.</span></label>
      </div>
      <div class="df"><span class="why">{{up.nfWhy}}</span><div class="btns"><button class="btn btn-ghost" onClick="{{up.cancelAdd}}">Cancel</button><button class="btn btn-pri" disabled="{{up.nfDisabled}}" onClick="{{up.addFac}}">Add facility</button></div></div>
      </template>

      <template data-sc="if" data-value="{{up.isFacList}}">
      <div class="db" data-key="k10">
        <input class="inp" type="search" aria-label="Which facility are these files from?" placeholder="Which facility are these from?" value="{{up.q}}" onChange="{{up.onQ}}">
        <div class="picklist" role="radiogroup" aria-label="Facility">
          <template data-sc="for" data-list="{{up.facList}}" data-as="f">
            <button class="pickrow {{f.cls}}" role="radio" aria-checked="{{f.on}}" onClick="{{f.pick}}">
              <span class="mav {{f.monoCls}}">{{f.mono}}</span>
              <span class="dtx"><b>{{f.name}}</b><span>{{f.meta}}</span></span>
              <span class="radio"></span>
            </button>
          </template>
        </div>
        <p class="hint" style="margin: 0">Not listed? <button class="link" onClick="{{up.startAdd}}">Add a facility</button></p>
      </div>
      <div class="df"><span class="why">{{up.why}}</span><div class="btns"><button class="btn btn-ghost" onClick="{{closeDrawer}}">Cancel</button><button class="btn btn-pri" disabled="{{up.noTarget}}" onClick="{{up.next}}">Continue</button></div></div>
      </template>

      <template data-sc="if" data-value="{{up.isFiles}}">
      <div class="db" data-key="k11">
        <div class="chosen"><span class="mav {{up.monoCls}}">{{up.mono}}</span><span class="dtx"><b>{{up.targetName}}</b><span>Facility</span></span><button class="btn btn-sm btn-ghost" onClick="{{up.back}}">Change</button></div>
        <div class="drop">
          <div class="drop-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"></path></svg></div>
          <b>Drop census and face sheets</b>
          <span>PDF, fax or photo · the census date is read from the file</span>
          <div class="samples"><span class="btn btn-sm filepick"><span>Browse files</span><input type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff" aria-label="Browse files" onChange="{{up.onBrowse}}"></span></div>
          <span style="margin-top: 10px">Or try a sample</span>
          <div class="samples"><button class="btn btn-sm btn-ghost" onClick="{{up.addMatch}}">Linden census 10/09</button><button class="btn btn-sm btn-ghost" onClick="{{up.addMismatch}}">Larkspur census 10/07</button></div>
        </div>
        <template data-sc="if" data-value="{{up.hasFile}}">
          <div class="file">
            <div class="file-top"><span class="fico">PDF</span><div><b>{{up.fileName}}</b><span>Daily census · {{up.pages}} pages · PointClickCare</span></div><span class="read">Recognised</span></div>
            <dl class="kv"><dt>Printed for</dt><dd>{{up.printedName}}</dd></dl>
            <div class="fgrid">
              <label class="field">Read as
                <span class="sel"><select class="inp" value="{{up.ftype}}" onChange="{{up.onType}}"><option value="census">Daily census</option><option value="fs">Face sheets</option><option value="both">Census and face sheets</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
              </label>
              <label class="field">Census date<input class="inp" value="{{up.dateVal}}" onChange="{{up.onDate}}"><span class="hint">Read from the page header</span></label>
            </div>
            <label class="field">Note<input class="inp" value="{{up.note}}" onChange="{{up.onNote}}" placeholder="e.g. Wing B board, faxed Monday"><span class="hint">Shown on the audit, in exports and on printouts</span></label>
          </div>
        </template>
        <template data-sc="if" data-value="{{up.mismatch}}">
          <div class="warnbox">
            <div><b>This census is printed for {{up.printedName}}.</b> You chose {{up.targetName}}, so residents would be matched against the wrong list.</div>
            <div class="btns"><button class="btn btn-pri btn-sm" onClick="{{up.switchTo}}"><span>Switch to {{up.printedName}}</span></button><button class="btn btn-ghost btn-sm" onClick="{{up.ack}}"><span>Keep {{up.targetName}}</span></button></div>
          </div>
        </template>
        <div class="drsec">
          <div><h4>DrChrono</h4><p>Used to look up each resident's last completed visit. Scanning needs it.</p></div>
          <div class="drrow"><span class="drico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v13H4zM9 7V4h6v3M12 11v5M9.5 13.5h5"></path></svg></span><span class="dtx"><b>{{dr.upTitle}}</b><span>{{dr.upSub}}</span></span><template data-sc="if" data-value="{{dr.on}}"><span class="ready">Ready</span></template><template data-sc="if" data-value="{{dr.off}}"><button class="btn btn-sm" onClick="{{dr.connect}}">Connect</button></template></div>

/* Minimal runtime for the CensusCare prototype.

  'use strict';

  var tpl = document.getElementById('tpl').content;

      if (name === 'defaultvalue') { props.push(['value', at.value.indexOf('{{') >= 0 ? interp(at.value, scope) : at.value]); unc = true; continue; }
