<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CensusCare — census audits prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7F5}
a{color:#3F6B2E}a:hover{color:#2B4D1F}
.app{position:relative;display:flex;flex-wrap:wrap;min-height:980px;font-family:Geist,Inter,system-ui,sans-serif;color:#0F0F10;background:#F7F7F5;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-0.005em}
button{font-family:inherit;letter-spacing:inherit}
/* sidebar */
.side{flex:0 0 248px;box-sizing:border-box;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.brand{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;margin-bottom:14px}
.brand:hover{background:#EFEFEC}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(180deg,#D9EBC8,#C3DDAA);color:#21401A;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(33,64,26,.08)}
.brand-t{flex:1;min-width:0}.brand-t b{display:block;font-size:14px;font-weight:600}.brand-t span{display:block;font-size:12px;color:#8A8A8F}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:9px;font-size:14px;color:#5B5B60;cursor:pointer;min-height:38px}
.nav svg{flex:none;color:#8A8A8F}
.nav:hover{background:#EFEFEC;color:#0F0F10}.nav:focus-visible{outline:2px solid #3F6B2E}
.nav-on{background:#fff;color:#0F0F10;font-weight:500;box-shadow:0 1px 2px rgba(15,15,16,.06),0 0 0 1px rgba(15,15,16,.05)}.nav-on svg{color:#0F0F10}
.nav .badge{margin-left:auto}
.badge{font-size:11px;font-weight:600;background:#0F0F10;color:#fff;border-radius:999px;padding:0 7px;line-height:18px;min-width:6px;text-align:center}
.grp{font-size:12px;font-weight:500;color:#8A8A8F;padding:20px 10px 6px}
.drc{appearance:none;border:0;font:inherit;text-align:left;cursor:pointer;width:100%;margin-top:auto;padding:12px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px rgba(15,15,16,.05);font-size:12px;color:#5B5B60;display:flex;align-items:center;gap:10px}
.drc b{display:block;color:#0F0F10;font-weight:500;font-size:13px}
.pulse{width:8px;height:8px;border-radius:50%;background:#4D9A3A;box-shadow:0 0 0 4px rgba(77,154,58,.15);flex:none}
/* frame */
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;padding:8px 8px 8px 0;box-sizing:border-box}
.surface{flex:1;background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgba(15,15,16,.06),0 1px 3px rgba(15,15,16,.04);display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 32px;min-height:60px;border-bottom:1px solid #F0F0EE;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:#8A8A8F}
.crumb{all:unset;cursor:pointer;color:#8A8A8F;padding:4px 6px;border-radius:6px}.crumb:hover{color:#0F0F10;background:#F4F4F2}
.crumb-now{color:#0F0F10;font-weight:500;padding:4px 6px}
.sep{color:#D6D6D3}
.search{all:unset;box-sizing:border-box;cursor:text;display:flex;align-items:center;gap:8px;min-width:260px;min-height:36px;padding:0 8px 0 12px;border-radius:10px;background:#F4F4F2;color:#8A8A8F;font-size:13px}
.search:hover{background:#EFEFEC}
.search .stext{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-family:'Geist Mono',monospace;font-size:11px;color:#5B5B60;background:#fff;border-radius:6px;padding:2px 6px;box-shadow:0 0 0 1px rgba(15,15,16,.08)}
.guide{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#2B4D1F;background:#EEF6E6;border-radius:10px;padding:0 12px;min-height:36px;font-size:13px;font-weight:500}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#E9E9E6,#D9D9D5);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#3A3A3E}
.page{padding:36px 32px 64px;display:flex;flex-direction:column;gap:28px;max-width:1220px;width:100%;box-sizing:border-box;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.title{display:flex;gap:16px;align-items:center}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-0.025em;line-height:1.15}
.sub{margin:8px 0 0;color:#8A8A8F;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub i{font-style:normal;color:#D6D6D3}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;background:#fff;color:#0F0F10;white-space:nowrap;box-shadow:0 0 0 1px rgba(15,15,16,.1),0 1px 2px rgba(15,15,16,.05);transition:background .12s,box-shadow .12s}
.btn:hover{background:#F7F7F5}.btn:focus-visible{outline:2px solid #3F6B2E;outline-offset:2px}
.btn-pri{background:#0F0F10;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(15,15,16,.2),0 0 0 1px #0F0F10}.btn-pri:hover{background:#26262A}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn-ghost{box-shadow:none;background:transparent;color:#5B5B60}.btn-ghost:hover{background:#F4F4F2;color:#0F0F10}
.btn-accent{background:#FFF3E8;color:#A33A0C;box-shadow:0 0 0 1px #FAD5B7}.btn-accent:hover{background:#FFEBDA}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:#3F6B2E;font-weight:500}.link:hover{text-decoration:underline;text-underline-offset:3px}
/* surfaces */
.card{background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(15,15,16,.07),0 1px 2px rgba(15,15,16,.03)}
.seg{display:inline-flex;gap:2px;padding:3px;background:#F2F2EF;border-radius:11px;flex-wrap:wrap}
.pill{all:unset;box-sizing:border-box;cursor:pointer;min-height:32px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;color:#5B5B60;display:inline-flex;align-items:center;gap:8px}
.pill:hover{color:#0F0F10}
.pill-on{background:#fff;color:#0F0F10;box-shadow:0 1px 2px rgba(15,15,16,.08),0 0 0 1px rgba(15,15,16,.04)}
.pill i{font-style:normal;color:#A1A1A6;font-weight:500;font-size:12px}
.field{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:500;color:#3A3A3E}
.inp{box-sizing:border-box;min-height:40px;border:0;box-shadow:0 0 0 1px rgba(15,15,16,.12);border-radius:10px;padding:0 12px;font:inherit;font-weight:400;font-size:14px;background:#fff;color:#0F0F10}
.inp:focus{outline:none;box-shadow:0 0 0 1px #3F6B2E,0 0 0 4px rgba(63,107,46,.15)}
.sel{position:relative;display:flex;align-items:center}
.sel select.inp{appearance:none;-webkit-appearance:none;-moz-appearance:none;width:100%;padding-right:42px;cursor:pointer;text-overflow:ellipsis}
.sel svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:#8A8A8F}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tablebox{overflow-x:auto}
/* tables */
.grid-a{display:grid;grid-template-columns:minmax(280px,2.4fr) 120px 96px 72px 72px 140px 170px;align-items:center;column-gap:16px;padding:0 20px;min-width:1000px;box-sizing:border-box}
.grid-f{display:grid;grid-template-columns:minmax(300px,2.4fr) 160px 90px 130px 200px;align-items:center;column-gap:16px;padding:0 20px;min-width:880px;box-sizing:border-box}
.grid-r{display:grid;grid-template-columns:72px minmax(240px,2.2fr) 120px 130px 120px 130px;align-items:center;column-gap:16px;padding:0 20px;min-width:880px;box-sizing:border-box}
.th{height:40px;font-size:12px;font-weight:500;color:#8A8A8F;background:#FAFAF9;border-bottom:1px solid #F0F0EE}
.card>.th:first-child{border-radius:14px 14px 0 0}
.tr{appearance:none;-webkit-appearance:none;margin:0;border:0;border-bottom:1px solid #F4F4F2;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;min-height:64px;transition:background .1s}
.tr:last-child{border-bottom:0}
.tr:hover{background:#FAFAF8}.tr:focus-visible{outline:2px solid #3F6B2E;outline-offset:-2px}
.tr-dim{color:#A1A1A6}.tr-dim .nm>b{color:#8A8A8F}.tr-dim .num{color:#A1A1A6}.tr-dim .mav{opacity:.5}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.nm{min-width:0}
.nm>b{display:block;font-weight:500;font-size:14px;color:#0F0F10}.nm>span{display:block;font-size:12px;color:#A1A1A6;margin-top:3px}
.mav{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;letter-spacing:0}
.m0{background:#EEF6E6;color:#2B4D1F}.m1{background:#EAF1FE;color:#1E3A8A}.m2{background:#FDF0E6;color:#8A3410}.m3{background:#F3EDFD;color:#4C2A85}.m4{background:#E8F5F3;color:#165E54}
.pav{width:30px;height:30px;border-radius:50%;background:#F2F2EF;color:#5B5B60;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none;letter-spacing:0}
.num{font-size:14px;color:#3A3A3E}
.room{font-family:'Geist Mono',monospace;font-size:13px;color:#5B5B60}
.num-hot{color:#C2410C;font-weight:600}
.dim{color:#C9C9C6}
.tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:#F2F2EF;color:#8A8A8F;vertical-align:1px}
.tag-dup{background:#FFF3E8;color:#A33A0C}
/* status text with dot */
.st{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#3A3A3E;white-space:nowrap}
.st::before{content:'';width:7px;height:7px;border-radius:50%;background:#A1A1A6;flex:none}
.st-review::before{background:#E0A100;box-shadow:0 0 0 3px rgba(224,161,0,.15)}
.st-ok::before{background:#4D9A3A;box-shadow:0 0 0 3px rgba(77,154,58,.15)}
.st-warn::before{background:#EA580C;box-shadow:0 0 0 3px rgba(234,88,12,.15)}
.st-muted{color:#A1A1A6}.st-muted::before{background:#D6D6D3}
/* chips only for meaning */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.c-due{background:#FFF1E6;color:#A33A0C}
.c-new{background:#fff;color:#5B5B60;box-shadow:inset 0 0 0 1px #E2E2DE}
.c-new::before{background:transparent;box-shadow:inset 0 0 0 1.5px #A1A1A6;opacity:1}
.c-notdue{background:#F2F2EF;color:#5B5B60}
.c-miss{background:#FFF3E8;color:#A33A0C;box-shadow:inset 0 0 0 1px #FAD5B7}
.c-req{background:#EDF3FF;color:#1D4ED8}
.q{font-size:13px;color:#8A8A8F}
.q-warn{font-size:13px;color:#B45309;font-weight:500}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border-radius:14px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:2px;min-height:118px;box-shadow:0 0 0 1px rgba(15,15,16,.07),0 1px 2px rgba(15,15,16,.03);transition:box-shadow .15s,transform .15s}
.kpi:hover{box-shadow:0 0 0 1px rgba(15,15,16,.12),0 4px 12px rgba(15,15,16,.06);transform:translateY(-1px)}.kpi:focus-visible{outline:2px solid #3F6B2E;outline-offset:2px}
.kpi-on{box-shadow:0 0 0 2px #0F0F10,0 4px 12px rgba(15,15,16,.08)}
.kpi-on:hover{box-shadow:0 0 0 2px #0F0F10,0 4px 12px rgba(15,15,16,.08)}
.kpi-l{display:flex;align-items:center;gap:8px;font-size:13px;color:#5B5B60;font-weight:500}
.kdot{width:8px;height:8px;border-radius:3px;flex:none}
.k-all{background:#0F0F10}.k-due{background:#EA580C}.k-notdue{background:#A1A1A6}.k-new{background:#fff;box-shadow:inset 0 0 0 1.5px #A1A1A6}.k-missing{background:#E0A100}
.kpi-n{font-size:32px;font-weight:600;letter-spacing:-0.03em;margin-top:6px;line-height:1.1}
.kpi-s{font-size:12px;color:#A1A1A6;margin-top:2px}
.kpi-warn .kpi-n{color:#C2410C}
.bar{display:block;margin-top:10px}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #F0F0EE}
.tbar-l{display:flex;align-items:center;gap:12px;font-size:13px;color:#5B5B60;font-weight:500}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:#F7F7F5;color:#5B5B60;font-size:13px;box-shadow:inset 0 0 0 1px #EEEEEB}
.note{padding:40px;text-align:center;color:#8A8A8F;font-size:14px}
.empty{padding:72px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.empty h3{margin:6px 0 0;font-size:18px;font-weight:600;letter-spacing:-0.015em}
.empty p{margin:0 0 10px;max-width:420px;color:#8A8A8F;line-height:1.6}
.ico{width:52px;height:52px;border-radius:14px;background:linear-gradient(180deg,#F4F9EF,#E6F1DB);color:#3F6B2E;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(63,107,46,.12)}
/* facility */
.tabs{display:flex;gap:4px;padding:3px;background:#F2F2EF;border-radius:11px;width:max-content}
.tab{all:unset;cursor:pointer;padding:0 14px;min-height:32px;border-radius:8px;font-size:13px;font-weight:500;color:#5B5B60;display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:#0F0F10}
.tab-on{background:#fff;color:#0F0F10;box-shadow:0 1px 2px rgba(15,15,16,.08),0 0 0 1px rgba(15,15,16,.04)}
.tab i{font-style:normal;font-size:12px;color:#A1A1A6}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.metaitem{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1.3;color:#5B5B60;background:#F7F7F5;border-radius:999px;padding:2px 9px}
.metaitem svg{color:#A1A1A6;width:12px;height:12px}
.unset{color:#8A8A8F}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(15,15,16,.18);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20}
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(460px,calc(100% - 20px));background:#fff;z-index:21;display:flex;flex-direction:column;border-radius:18px;box-shadow:0 0 0 1px rgba(15,15,16,.06),0 24px 64px rgba(15,15,16,.16);overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 24px 18px}
.dh h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-0.015em}.dh p{margin:4px 0 0;font-size:13px;color:#8A8A8F}
.x{all:unset;cursor:pointer;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#8A8A8F;margin:-4px -6px 0 0}.x:hover{background:#F4F4F2;color:#0F0F10}
.db{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 24px 24px;display:flex;flex-direction:column;gap:22px}
.df{padding:14px 24px;background:#FAFAF9;border-top:1px solid #F0F0EE;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.why{font-size:13px;color:#B45309}
.drop{border:1.5px dashed #D6D6D3;border-radius:14px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:#FAFAF9}
.drop-ico{width:44px;height:44px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px rgba(15,15,16,.08),0 1px 2px rgba(15,15,16,.05);display:flex;align-items:center;justify-content:center;color:#3A3A3E;margin-bottom:6px}
.drop b{font-size:15px;font-weight:600}.drop span{font-size:13px;color:#8A8A8F}
.samples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.file{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 1px rgba(15,15,16,.08)}
.file-top{display:flex;gap:12px;align-items:center}
.fico{width:36px;height:36px;border-radius:9px;background:#FDF0E6;color:#8A3410;display:flex;align-items:center;justify-content:center;flex:none;font-size:10px;font-weight:700}
.file-top>div{flex:1;min-width:0}
.file-top>div>b{display:block;font-size:14px;font-weight:500}.file-top>div>span{display:block;font-size:12px;color:#8A8A8F;margin-top:2px}
.read{font-size:12px;color:#2B4D1F;background:#EEF6E6;border-radius:999px;padding:2px 10px;font-weight:500}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;font-size:13px;margin:0;padding-top:12px;border-top:1px solid #F4F4F2}
.kv dt{color:#8A8A8F}.kv dd{margin:0;color:#0F0F10}
.warnbox{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;color:#7C2D12;font-size:14px;line-height:1.55;background:#FFF8F2;box-shadow:inset 0 0 0 1px #FAD5B7}
.warnbox b{color:#5A1F0B;font-weight:600}
.okbox{border-radius:12px;padding:12px 14px;font-size:13px;color:#2B4D1F;background:#F1F8EB;display:flex;gap:8px;align-items:center}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sum div{border-radius:12px;padding:14px;box-shadow:0 0 0 1px rgba(15,15,16,.07)}
.sum b{display:block;font-size:26px;font-weight:600;letter-spacing:-0.02em}.sum span{font-size:12px;color:#8A8A8F}
.picks{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(15,15,16,.08)}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid #F4F4F2;font-weight:400;color:#0F0F10}
.pick:last-child{border-bottom:0}
.pick:hover{background:#FAFAF9}
.pick input{width:16px;height:16px;margin:0;accent-color:#0F0F10;flex:none}
.pick-name{flex:1;text-align:left}
.pick-room{font-family:'Geist Mono',monospace;font-size:12px;color:#A1A1A6}
.scope{display:flex;justify-content:space-between;align-items:center;gap:10px}
.msg{border-radius:12px;padding:14px;font-size:13px;color:#5B5B60;line-height:1.6;background:#FAFAF9;white-space:pre-line;font-weight:400;box-shadow:inset 0 0 0 1px #EEEEEB}
.src{border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;box-shadow:0 0 0 1px rgba(15,15,16,.08)}
.src>div>b{display:block;font-size:13px;font-weight:500}.src>div>span{color:#8A8A8F;font-size:12px}
.hint{font-size:12px;color:#8A8A8F;font-weight:400}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#0F0F10;color:#fff;padding:10px 16px 10px 12px;border-radius:999px;font-size:13px;font-weight:500;z-index:30;box-shadow:0 12px 32px rgba(15,15,16,.24)}
.tick{width:20px;height:20px;border-radius:50%;background:#4D9A3A;display:flex;align-items:center;justify-content:center;flex:none}
/* search */
.searchbig{display:flex;align-items:center;gap:12px;padding:0 8px 0 18px;min-height:56px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px rgba(15,15,16,.1),0 4px 16px rgba(15,15,16,.05);color:#8A8A8F}
.searchbig:focus-within{box-shadow:0 0 0 1px #3F6B2E,0 0 0 4px rgba(63,107,46,.15)}
.sbin{flex:1;border:0;outline:0;font:inherit;font-size:16px;color:#0F0F10;background:transparent;min-height:54px}
.split{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.facet{display:flex;flex-direction:column;gap:2px}
.fbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:9px;font-size:13px;color:#5B5B60}
.fbtn:hover{background:#F4F4F2;color:#0F0F10}
.fbtn i{font-style:normal;font-size:12px;color:#A1A1A6}
.fbtn-on{background:#fff;color:#0F0F10;font-weight:500;box-shadow:0 1px 2px rgba(15,15,16,.06),0 0 0 1px rgba(15,15,16,.05)}
.grid-s{display:grid;grid-template-columns:60px minmax(190px,2fr) minmax(140px,1.4fr) 96px 104px 104px;align-items:center;column-gap:14px;padding:0 18px;min-width:740px;box-sizing:border-box}
.filters{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #F0F0EE}
/* members */
.grid-m{display:grid;grid-template-columns:minmax(260px,2fr) 130px 120px 120px 150px;align-items:center;column-gap:16px;padding:0 20px;min-width:820px;box-sizing:border-box}
.trs{min-height:64px;border-bottom:1px solid #F4F4F2}.trs:last-child{border-bottom:0}
.you{display:inline-block;margin-left:8px;font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:#EEF6E6;color:#2B4D1F;vertical-align:1px}
.grid-p{display:grid;grid-template-columns:minmax(260px,1fr) 120px 120px;align-items:center;column-gap:16px;padding:0 20px;min-height:48px;border-bottom:1px solid #F4F4F2;font-size:14px;color:#3A3A3E}
.grid-p:last-child{border-bottom:0}
.yes{color:#3F8A2E;display:inline-flex}.no{color:#C9C9C6}
.cardh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:20px 20px 16px;border-bottom:1px solid #F0F0EE}
.cardh h3{margin:0;font-size:15px;font-weight:600}.cardh p{margin:4px 0 0;font-size:13px;color:#8A8A8F}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border-radius:12px;padding:14px;box-shadow:0 0 0 1px rgba(15,15,16,.1);display:flex;flex-direction:column;gap:4px}
.opt b{font-size:14px;font-weight:600}.opt span{font-size:12px;color:#8A8A8F;font-weight:400;line-height:1.45}
.opt-on{box-shadow:0 0 0 2px #0F0F10;background:#FAFAF9}
.pw{display:flex;gap:8px;align-items:center}
.pwv{flex:1;min-height:40px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:#F7F7F5;font-family:'Geist Mono',monospace;font-size:13px;box-shadow:inset 0 0 0 1px #EEEEEB}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:400;color:#3A3A3E;cursor:pointer}
.chk input{width:16px;height:16px;margin:2px 0 0;accent-color:#0F0F10;flex:none}
.chk b{display:block;font-weight:500;color:#0F0F10}
/* settings */
.sec{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding:28px 0;border-top:1px solid #F0F0EE}
.sec:first-child{border-top:0}
.sec h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-0.01em}.sec p{margin:6px 0 0;font-size:13px;color:#8A8A8F;line-height:1.55}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 16px}
.full{grid-column:1 / -1}
.opt-l{font-weight:400;color:#A1A1A6;margin-left:4px}
.logo-row{display:flex;align-items:center;gap:16px}
.logo-big{width:56px;height:56px;border-radius:14px;background:linear-gradient(180deg,#D9EBC8,#C3DDAA);color:#21401A;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.conn{border-radius:14px;padding:18px;box-shadow:0 0 0 1px rgba(15,15,16,.08);display:flex;flex-direction:column;gap:16px}
.conn-top{display:flex;align-items:center;gap:12px}
.conn-top b{display:block;font-size:14px;font-weight:600}.conn-top span{display:block;font-size:12px;color:#8A8A8F}
.preview{border-radius:12px;padding:12px 14px;background:#F7F7F5;font-size:13px;color:#5B5B60;box-shadow:inset 0 0 0 1px #EEEEEB}
.preview b{color:#0F0F10}
.savebar{position:sticky;bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:14px;background:#0F0F10;color:#fff;font-size:13px;box-shadow:0 12px 32px rgba(15,15,16,.24)}
.savebar .btn{box-shadow:none}
/* feedback */
.grid-fb{display:grid;grid-template-columns:minmax(260px,2fr) 140px 140px 120px;align-items:center;column-gap:16px;padding:0 20px;min-width:720px;box-sizing:border-box}
.steps{display:flex;flex-direction:column;gap:0;padding-left:4px}
.step{display:flex;gap:12px;align-items:center;min-height:32px;font-size:13px;color:#A1A1A6;position:relative}
.step i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 2px #D6D6D3;flex:none;background:#fff}
.step-on{color:#0F0F10;font-weight:500}.step-on i{background:#E0A100;box-shadow:0 0 0 4px rgba(224,161,0,.15)}
.legend{font-size:12px;color:#8A8A8F}
/* colour system v2: Due = orange, New = blue, Not due = grey, Missing face sheet = rose, To review = amber, Reviewed = green */
.kpi-on{box-shadow:0 0 0 1.5px #0F0F10,0 4px 14px rgba(15,15,16,.06)}
.kpi-on:hover{box-shadow:0 0 0 1.5px #0F0F10,0 4px 14px rgba(15,15,16,.08)}
.kon-all{background:#FAFAF9}
.kpi-total .kdot{display:none}
.kpi-total{background:#FAFAF9;box-shadow:0 0 0 1px rgba(15,15,16,.06)}
.kpi-total .kpi-l{color:#5B5B60}
.kon-due{background:#FFF8F3;box-shadow:0 0 0 1.5px #EA580C,0 4px 14px rgba(234,88,12,.08)}.kon-due:hover{box-shadow:0 0 0 1.5px #EA580C,0 4px 14px rgba(234,88,12,.1)}
.kon-notdue{background:#FAFAF9;box-shadow:0 0 0 1.5px #8A8A8F,0 4px 14px rgba(15,15,16,.06)}.kon-notdue:hover{box-shadow:0 0 0 1.5px #8A8A8F,0 4px 14px rgba(15,15,16,.08)}
.kon-new{background:#FAFAF9;box-shadow:0 0 0 1.5px #8A8A8F}.kon-new:hover{box-shadow:0 0 0 1.5px #8A8A8F}
.kon-missing{background:#FFF7F8;box-shadow:0 0 0 1.5px #E11D48,0 4px 14px rgba(225,29,72,.08)}.kon-missing:hover{box-shadow:0 0 0 1.5px #E11D48,0 4px 14px rgba(225,29,72,.1)}
.k-missing{background:#E11D48}
.kpi-warn .kpi-n{color:#BE123C}
.c-miss{background:#FFF1F2;color:#BE123C;box-shadow:inset 0 0 0 1px #FECDD3}
.q-warn{color:#BE123C}
.num-hot{color:#BE123C}
.st-warn::before{background:#E11D48;box-shadow:0 0 0 3px rgba(225,29,72,.15)}
.btn-accent{background:#FFF1F2;color:#BE123C;box-shadow:0 0 0 1px #FECDD3}.btn-accent:hover{background:#FFE4E8}
.bar{margin-top:12px;border-radius:3px;overflow:hidden}
/* compact density */
.page{padding:24px 32px 56px;gap:18px}
.head{align-items:center}
h1{font-size:22px;letter-spacing:-0.02em}
.sub{margin-top:4px;font-size:13px}
.title{gap:14px}
.kpis{gap:10px}
.kpi{min-height:0;padding:12px 14px 12px;gap:10px}
.kpi:hover{transform:none}
.kpi-row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.kpi-l{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kpi-n{font-size:22px;margin:0;line-height:1}
.kpi-total{padding-bottom:12px}
.bar{margin-top:0;height:4px}
.th{height:36px}
.tr{min-height:52px}
.tbar{padding:8px 20px}
.pav{width:28px;height:28px}
.mav{width:32px;height:32px}
/* control scale: one size everywhere = the search field (36px, 13px, radius 10) */
.btn{min-height:36px;padding:0 14px;font-size:13px;border-radius:10px;gap:7px}
.btn svg{width:15px;height:15px}
.btn-sm{min-height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.inp{min-height:36px;font-size:13px;border-radius:10px;padding:0 12px}
textarea.inp{padding:9px 12px;line-height:1.5}
.sel svg{right:12px;width:15px;height:15px}
.sel select.inp{padding-right:36px}
.seg{padding:3px;border-radius:10px}
.pill{min-height:30px;padding:0 12px;border-radius:8px}
.tabs{border-radius:10px}
.tab{min-height:30px;padding:0 12px}
.search,.guide{min-height:36px;border-radius:10px}
.searchbig{min-height:48px;border-radius:12px;padding:0 6px 0 14px}
.sbin{min-height:46px;font-size:15px}
.field{font-size:13px;gap:6px}
.db{gap:20px}
.dh h2,.vh h2{font-size:17px}
.pwv{min-height:36px;font-size:12.5px;border-radius:10px}
.opt{padding:12px;border-radius:10px}
.x{width:30px;height:30px;border-radius:8px}
.avatar{width:30px;height:30px;font-size:11px}
.why{font-size:12px;color:#8A8A8F;font-weight:400}
.ustep{display:flex;flex-direction:column;gap:8px}
.ustep-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#3A3A3E}
.snum{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:#F2F2EF;color:#8A8A8F;flex:none}
.snum-on{background:#0F0F10;color:#fff}
.snum-done{background:#EEF6E6;color:#2B4D1F}
.drop{padding:22px 18px;gap:6px}
.drop-off{opacity:.45;pointer-events:none;border-style:dashed}
.df{padding:12px 24px}
/* filter tabs (replace KPI cards) */
.tbar-tabs{padding:0 16px 0 8px;min-height:52px;align-items:stretch}
.tbar-tabs .btns{align-items:center;gap:2px}
.tbar-tabs .btn-sm{min-height:30px;padding:0 10px;font-size:13px;border-radius:8px;gap:6px}
.tbar-tabs .btn-sm svg{width:14px;height:14px}
.tbar-tabs .btn-accent{background:transparent;box-shadow:none;color:#BE123C;font-weight:500}
.tbar-tabs .btn-accent:hover{background:#FFF1F2}
.tbar-tabs .btn-ghost{color:#8A8A8F}.tbar-tabs .btn-ghost:hover{color:#0F0F10}
.tsep{width:1px;height:16px;background:#E6E6E3;margin:0 6px}
.ftabs{display:flex;align-items:stretch;gap:2px;flex-wrap:wrap}
.ftab{appearance:none;-webkit-appearance:none;margin:0;border:0;background:transparent;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;font-weight:500;color:#5B5B60;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:52px}
.ftab:hover{color:#0F0F10}
.ftab:focus-visible{outline:2px solid #3F6B2E;outline-offset:-4px;border-radius:8px}
.ftab b{font-weight:600;font-size:12px;color:#5B5B60;background:#F2F2EF;border-radius:999px;padding:1px 8px;min-width:10px;text-align:center}
.ftab b.n-hot{color:#BE123C;background:#FFF1F2}
.ftab .k-all{display:none}
.ftab-on{color:#0F0F10}
.ftab-on b{background:#0F0F10;color:#fff}
.ftab-on b.n-hot{background:#E11D48;color:#fff}
.ft-all{border-bottom-color:#0F0F10}.ft-due{border-bottom-color:#EA580C}.ft-notdue{border-bottom-color:#8A8A8F}.ft-new{border-bottom-color:#8A8A8F}.ft-missing{border-bottom-color:#E11D48}
/* resident history */
.dupnote{display:block;margin-top:4px;font-size:12px;color:#8A8A8F}
.eyebrow{margin:0 0 2px !important;font-size:12px;color:#8A8A8F}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.c-cov2{background:#EEF6E6;color:#2F5D22}
.c-unk2{background:#F4F4F5;color:#5B5B60;box-shadow:inset 0 0 0 1px #D4D4D8}
.c-out{background:#fff;color:#5B5B60;box-shadow:inset 0 0 0 1px #D4D4D8}
.c-out::before{opacity:.5}
.editbox{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:12px;background:#FAFAF9;box-shadow:inset 0 0 0 1px #EEEEEB}
.hgroup{display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:1px solid #EDEDEA}
.hhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:2px}
.hhead b{font-size:15px;font-weight:600;letter-spacing:-0.01em;color:#0F0F10}.hhead span{font-size:12px;color:#8A8A8F}
.empty-s{margin:0;font-size:13px;color:#8A8A8F;padding:12px 14px;border-radius:12px;background:#FAFAF9;box-shadow:inset 0 0 0 1px #EEEEEB;line-height:1.5}
.empty-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.moved{display:inline-flex !important;align-items:center;gap:4px;margin-top:4px !important;font-size:12px !important;color:#1D4ED8 !important;font-weight:500 !important}
.tag-cur{background:#EEF6E6;color:#2B4D1F}
.docrow .chip{flex:none}
.docrow-old{background:#FCFCFB}.docrow-old .dtx>b{color:#8A8A8F}
.ithumb{width:32px;height:32px;border-radius:7px;background:linear-gradient(180deg,#F6F8FC,#E3E9F4);box-shadow:inset 0 0 0 1px #D5DCE8;font-size:7px;font-weight:700;color:#1E3A8A;display:flex;align-items:center;justify-content:center;letter-spacing:.02em;flex:none;overflow:hidden}
/* version timeline */
.tl{display:flex;flex-direction:column}
.tlrow{box-sizing:border-box;min-width:0;appearance:none;-webkit-appearance:none;margin:0;border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;display:flex;align-items:flex-start;gap:14px;padding:6px 8px 18px 30px;border-radius:12px;width:100%}
.tlrow:hover{background:#FAFAF8}.tlrow:focus-visible{outline:2px solid #3F6B2E;outline-offset:-2px}
.tlrow::before{content:'';position:absolute;left:10px;top:24px;bottom:-6px;width:2px;background:#E6E6E3}
.tlrow:last-child{padding-bottom:6px}.tlrow:last-child::before{display:none}
.tldot{position:absolute;left:4px;top:10px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #CFCFCB;z-index:1}
.tldot-on{background:#5B8A47;box-shadow:0 0 0 3px #fff}
.cthumb{flex:none;width:76px;height:48px;border-radius:8px;background:linear-gradient(180deg,#F3F6FB,#E8EDF6);box-shadow:inset 0 0 0 1px #CFD8E6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0 8px;box-sizing:border-box}
.cthumb b{font-size:9px;font-weight:700;letter-spacing:.06em;color:#1E3A8A;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cthumb i,.fthumb i{display:block;height:3px;border-radius:2px;background:#C8D2E2;width:100%}
.cthumb i.short,.fthumb i.short{width:55%;align-self:flex-start}
.fthumb{flex:none;width:40px;height:50px;border-radius:6px;background:#fff;box-shadow:inset 0 0 0 1px #DCDCD8,0 1px 2px rgba(15,15,16,.05);display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 8px;box-sizing:border-box}
.fthumb i{background:#E2E2DE}
.tltx{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding-top:1px}
.tltx>b{font-size:14px;font-weight:500;color:#0F0F10;line-height:1.35}
.tltx>span{font-size:12px;color:#8A8A8F;line-height:1.45}
.tltx .tag{margin:3px 0 2px;font-size:11.5px;padding:2px 8px;border-radius:6px}
.tlrow-old .tltx>b{color:#8A8A8F}.tlrow-old .cthumb{opacity:.65}
/* upload wizard */
.dh{border-bottom:1px solid #EDEDEA;flex:none}
.dh+.db{padding-top:20px}
.dh-wz{padding-bottom:16px}
.dh-wz~* .db{padding-top:20px}
.stepper{display:flex;align-items:center;gap:6px;margin-top:8px}
.stp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#A1A1A6;font-weight:500}
.stp:not(:last-child)::after{content:'';width:16px;height:1px;background:#DCDCD8;margin-left:4px}
.stp-n{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;background:#F2F2EF;color:#8A8A8F;flex:none}
.stp-cur{color:#0F0F10}.stp-cur .stp-n{background:#0F0F10;color:#fff}
.stp-done{color:#3A3A3E}.stp-done .stp-n{background:#EEF6E6;color:#2B4D1F}
.sth{margin:0;font-size:15px;font-weight:600;letter-spacing:-0.01em}
.picklist{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(15,15,16,.08)}
.pickrow{appearance:none;-webkit-appearance:none;margin:0;border:0;border-bottom:1px solid #F4F4F2;background:#fff;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%}
.pickrow:last-child{border-bottom:0}.pickrow:hover{background:#FAFAF8}
.pickrow:focus-visible{outline:2px solid #3F6B2E;outline-offset:-2px}
.pickrow-on{background:#F7FAF4}.pickrow-on:hover{background:#F2F7EE}
.radio{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #C9C9C6;flex:none;background:#fff}
.pickrow-on .radio{box-shadow:inset 0 0 0 5px #0F0F10}
.chosen{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#FAFAF9;box-shadow:inset 0 0 0 1px #EEEEEB}
/* history v3: match the app's resident panel */
.hlist{display:flex;flex-direction:column;gap:2px}
.hrow{display:flex;align-items:flex-start;gap:12px;padding:8px 0}
.hico{width:32px;height:32px;border-radius:8px;box-shadow:inset 0 0 0 1px #DCDCD8;display:flex;align-items:center;justify-content:center;color:#5B5B60;flex:none;background:#fff}
.hrow .tltx{flex:1}
.hrow .chip{margin-top:5px}
.hrow .btn,.tlrow .btn{flex:none;margin-top:2px}
.tlink{appearance:none;border:0;background:none;padding:0;margin:0;font:inherit;font-size:14px;font-weight:500;color:#0F0F10;text-decoration:underline;text-decoration-color:#C9C9C6;text-underline-offset:3px;cursor:pointer;text-align:left}
.tlink:hover{text-decoration-color:#0F0F10}
.tlrow{cursor:default}
.tlrow:hover{background:transparent}
.tlrow .tltx{flex:1}
.tlt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tlt .tag{margin:0}
.mono-d{font-family:'Geist Mono',monospace;font-size:13.5px !important;font-weight:500;color:#0F0F10}
button.cthumb{appearance:none;border:0;margin:0;font:inherit;cursor:pointer}
button.cthumb:hover{box-shadow:inset 0 0 0 1px #9FB0CC}
button.cthumb:focus-visible{outline:2px solid #3F6B2E;outline-offset:2px}
/* document list */
.doclist{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(15,15,16,.08)}
.docrow{appearance:none;-webkit-appearance:none;margin:0;border:0;border-bottom:1px solid #F4F4F2;background:#fff;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%}
.docrow:last-child{border-bottom:0}
.docrow:hover{background:#FAFAF8}.docrow:hover .darr{color:#0F0F10;transform:translateX(2px)}
.docrow:focus-visible{outline:2px solid #3F6B2E;outline-offset:-2px}
.dico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.d-census{background:#F2F2EF;color:#3A3A3E}.d-fs{background:#EEF6E6;color:#2B4D1F}.d-ins{background:#EAF1FE;color:#1E3A8A}
.dtx{flex:1;min-width:0}
.dtx>b{display:block;font-size:14px;font-weight:500;color:#0F0F10}.dtx>span{display:block;font-size:12px;color:#8A8A8F;margin-top:2px;font-weight:400}
.darr{color:#C9C9C6;flex:none;transition:transform .12s,color .12s}
/* notes + viewer */
